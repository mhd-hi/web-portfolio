<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 180" role="img" aria-labelledby="title">
  <title id="title">A lost location marker following a dotted path</title>
  <style>
    .marker { animation: float 3.2s ease-in-out infinite; transform-origin: 228px 70px; }
    .dash { animation: travel 5s linear infinite; }
    @keyframes float { 50% { transform: translateY(-7px) rotate(2deg); } }
    @keyframes travel { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .marker, .dash { animation: none; } }
  </style>
  <path class="dash" d="M30 135c45-67 91 25 137-31 27-33 60-38 124-58" fill="none" stroke="#49627f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 11"/>
  <circle cx="31" cy="135" r="7" fill="#0a192f" stroke="#64ffda" stroke-width="3"/>
  <g class="marker">
    <path d="M228 31c-22 0-39 17-39 39 0 29 39 67 39 67s39-38 39-67c0-22-17-39-39-39Z" fill="#112240" stroke="#64ffda" stroke-width="4" stroke-linejoin="round"/>
    <path d="M220 61c1-7 15-9 17-1 3 11-9 10-9 19" fill="none" stroke="#ccd6f6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="228" cy="91" r="3" fill="#ccd6f6"/>
  </g>
</svg>
